name: Skyroad complete native base all ten original safety checks
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/skyroad-complete-base-original-safety-nov07/**
      - .github/workflows/skyroad-complete-base-original-safety-nov07.yml
permissions: {contents: read}
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {fixture: loading-screen, scope: memory}
          - {fixture: load-leak, scope: memory}
          - {fixture: gear-tiers, scope: publicApi}
          - {fixture: hero-roster, scope: publicApi}
          - {fixture: tavern, scope: publicApi}
          - {fixture: tavern-menu, scope: publicApi}
          - {fixture: online-coop, scope: publicApi}
          - {fixture: canvas-retirement-selftest, scope: publicApi}
          - {fixture: skins, scope: publicApi}
          - {fixture: dressing, scope: publicApi}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: sprite-publication-safety-game
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: sprite-publication-original-tools
      - uses: actions/setup-node@v4
        with: {node-version: '24.11.1'}
      - name: Exact Skyroad source with all ten unchanged original standalone fixtures
        run: node tools/skyroad-complete-base-original-safety-nov07/${{ matrix.fixture }}.mjs
        env:
          PRIVATE_HERO_GAME: sprite-publication-safety-game
          PRIVATE_HERO_ORIGINAL_TOOLS: sprite-publication-original-tools
          PRIVATE_HERO_SAFETY_SCOPE: ${{ matrix.scope }}
          PRIVATE_HERO_SAFETY_OUT: ${{ runner.temp }}/skyroad-complete-base-original-safety-${{ matrix.fixture }}-nov07
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyroad-complete-base-original-safety-${{ matrix.fixture }}-nov07
          path: ${{ runner.temp }}/skyroad-complete-base-original-safety-${{ matrix.fixture }}-nov07/
          if-no-files-found: error
