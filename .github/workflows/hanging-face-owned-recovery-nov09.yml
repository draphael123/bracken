name: HangingFace bounded unanswered-control recovery
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/hanging-face-owned-recovery-nov09/**
      - .github/workflows/hanging-face-owned-recovery-nov09.yml
permissions: {contents: read}
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [default-roots, default-hollow, gpu, active-scope, proxy-zone, ceil-rect, ctor-proxy-Document, ctor-proxy-HTMLCanvasElement, ctor-bound-Document, ctor-bound-HTMLCanvasElement]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81, path: span-game, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.11.1'}
      - name: Exact original factory before candidate return native control
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/hanging-face-owned-recovery-nov09/component.mjs
        env:
          HANGING_FACE_CASE: ${{ matrix.case }}
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/hanging-face-recovery-${{ matrix.case }}-nov09
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/hanging-face-recovery-profile-${{ matrix.case }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanging-face-recovery-${{ matrix.case }}-nov09
          path: |
            ${{ runner.temp }}/hanging-face-recovery-${{ matrix.case }}-nov09/
            ${{ runner.temp }}/hanging-face-recovery-profile-${{ matrix.case }}.jsonl
          if-no-files-found: error
