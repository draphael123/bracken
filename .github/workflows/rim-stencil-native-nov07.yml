name: Rim private coordinate stencil native qualification
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/rim-stencil-native-nov07/manifest.json
      - tools/rim-stencil-native-nov07-page.mjs
      - tools/rim-stencil-native-nov07-cases.mjs
      - tools/rim-stencil-native-nov07.mjs
      - .github/workflows/rim-stencil-native-nov07.yml
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - name: New exact CPU/GPU native graphs, original observer fallbacks, original Node fixtures
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/rim-stencil-native-nov07.mjs
        env:
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/rim-stencil-native-nov07
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/eager-opaque-fixed-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rim-stencil-native-nov07
          path: |
            ${{ runner.temp }}/rim-stencil-native-nov07/
            ${{ runner.temp }}/eager-opaque-fixed-strict-profile.jsonl
          if-no-files-found: error
