        variant: [baseline-control, renderer-direct, current]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/renderer-campaign-proof.mjs 1 --only="$LEVEL" --variant="$VARIANT"
        env:
          VARIANT: ${{ matrix.variant }}
          LEVEL: ${{ inputs.variant_level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-variant-${{ matrix.variant }}
          path: gate-data/
  campaign:
    if: inputs.mode == 'campaign' || inputs.mode == 'region-props' || inputs.mode == 'fixed-ornaments'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/renderer-campaign-proof.mjs "$SHARD" --baseline="$BASELINE"
        env:
          SHARD: ${{ matrix.shard }}
          BASELINE: ${{ inputs.baseline || '5e44cddd' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-campaign-${{ matrix.shard }}
          path: gate-data/
  calls:
    if: inputs.mode == 'calls'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
