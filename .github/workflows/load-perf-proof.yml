name: load-perf-proof
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [palette-standing, palette-base, layout-candidate, foreground-reuse, foreground-direct, fixed-ornaments, region-props, border-present, tile-warm, captain-boot, cpu-profile, tile-cache, paladin-boot, hero-reuse, profile, sfx, compare, mobile, calls, present, campaign, variant, pixel-debug]
        default: profile
      baseline:
        type: string
        default: '5e44cddd'
      control:
        type: boolean
        default: false
      pixel_cpu:
        type: boolean
        default: false
      variant_level:
        type: choice
        options: [mage, witchlight]
        default: mage
      present:
        type: choice
        options: [copy, pattern, cpu-frame, sync-display, bitmap, opaque-frame]
        default: copy
env:
  PIXEL_CPU_CANVAS: ${{ inputs.pixel_cpu && '1' || '0' }}
permissions:
  contents: read
jobs:
  palette-standing:
    if: inputs.mode == 'palette-standing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: [memory,layout,campaign-1,campaign-2,campaign-3,campaign-4,campaign-5,campaign-6,campaign-7,campaign-8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: palette-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Original actual-Task3 proof without budget overrides
        run: |
          if [[ "$SCOPE" == campaign-* ]]; then
            node tools/palette-standing-proof.mjs campaign --shard="${SCOPE#campaign-}" --game=palette-game
          else
            node tools/palette-standing-proof.mjs "$SCOPE" --game=palette-game
          fi
        env:
          SCOPE: ${{ matrix.scope }}
          PALETTE_STANDING_OUT: ${{ runner.temp }}/palette-standing-${{ matrix.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-standing-${{ matrix.scope }}
          path: ${{ runner.temp }}/palette-standing-${{ matrix.scope }}/
          if-no-files-found: error
  palette-base-campaign:
    if: inputs.mode == 'palette-base'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/palette-base-cache-proof.mjs campaign "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
          PALETTE_CACHE_OUT: ${{ runner.temp }}/palette-base-campaign-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-base-campaign-${{ matrix.shard }}
          path: ${{ runner.temp }}/palette-base-campaign-${{ matrix.shard }}/
          if-no-files-found: error
  palette-base-original:
    if: inputs.mode == 'palette-base'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scope: [memory,layout]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/palette-base-cache-proof.mjs "$SCOPE"
        env:
          SCOPE: ${{ matrix.scope }}
          PALETTE_CACHE_OUT: ${{ runner.temp }}/palette-base-original-${{ matrix.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palette-base-original-${{ matrix.scope }}
          path: ${{ runner.temp }}/palette-base-original-${{ matrix.scope }}/
          if-no-files-found: error
  layout-candidate:
    if: inputs.mode == 'layout-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: layout-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/layout-candidate-proof.mjs --game=layout-game --verify-only
      - name: Original full strict layout with original600000ms deadline
        run: node tools/layout-candidate-proof.mjs --game=layout-game
        env:
          LAYOUT_CANDIDATE_OUT: ${{ runner.temp }}/bracken-layout-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-layout-candidate
          path: ${{ runner.temp }}/bracken-layout-candidate/
          if-no-files-found: error
  foreground-reuse:
    if: inputs.mode == 'foreground-reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/foreground-reuse-proof.mjs --verify-only
      - name: Original A/B/A controls and all120 frame/display/state/RNG samples
        run: node tools/foreground-reuse-proof.mjs "$LEVEL" --baseline=62d9c02c102decc69ceaef4e1ec593a23170f1ff --control
        env:
          LEVEL: ${{ matrix.level }}
          FOREGROUND_REUSE_OUT: ${{ runner.temp }}/bracken-foreground-reuse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foreground-reuse-${{ matrix.level }}
          path: ${{ runner.temp }}/bracken-foreground-reuse/
          if-no-files-found: error
  foreground-direct:
    if: inputs.mode == 'foreground-direct'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/foreground-direct-proof.mjs --verify-only
      - name: Original A/B/A controls and all120 frame/display/state/RNG samples
        run: node tools/foreground-direct-proof.mjs "$LEVEL" --baseline=62d9c02c102decc69ceaef4e1ec593a23170f1ff --control
        env:
          LEVEL: ${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foreground-direct-${{ matrix.level }}
          path: gate-data/foreground-direct/
          if-no-files-found: error
  fixed-ornaments:
    if: inputs.mode == 'fixed-ornaments'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/fixed-ornament-proof.mjs
      - name: Before, after and return to the explicit baseline
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          git worktree add --detach ../outline-before-local "$BASELINE"
          node tools/fixed-ornament-load-cost.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-ornament-components-and-loader
          path: gate-data/
  region-props:
    if: inputs.mode == 'region-props'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/region-prop-bake-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-prop-components
          path: gate-data/region-props/
  border-present:
    if: inputs.mode == 'border-present'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/display-border-proof.mjs --verify-only
      - name: Original viewport, CPU, all pixel samples and return control
        run: node tools/display-border-proof.mjs "$LEVEL" --baseline=ffd61f8d9c56feca694b6b8fb87559e0f50ee988 --control
        env:
          LEVEL: ${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: border-present-${{ matrix.level }}
          path: gate-data/
  tile-warm:
    if: inputs.mode == 'tile-warm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        level: [buriedcity, skyroad, rootway, redgorge, sealedpyramid, underwell, undercrown]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/level-tile-cache-selftest.mjs
      - run: node tools/tile-cache-warm-cost.mjs
      - run: node tools/same-level-load-proof.mjs --only="$LEVEL"
        env:
          LEVEL: ${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tile-warm-cost-${{ matrix.level }}
          path: gate-data/
  captain-boot:
    if: inputs.mode == 'captain-boot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/captain-boot-bake-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captain-boot
          path: gate-data/
  cpu-profile:
    if: inputs.mode == 'cpu-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/arena-cpu-profile.mjs "$LEVEL"
        env:
          LEVEL: ${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-cpu-${{ matrix.level }}
          path: gate-data/
  tile-cache:
    if: inputs.mode == 'tile-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/level-tile-cache-selftest.mjs
      - run: node tools/tile-cache-lifetime-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tile-cache-pixels
          path: gate-data/
  paladin-boot:
    if: inputs.mode == 'paladin-boot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/paladin-boot-bake-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paladin-boot
          path: gate-data/
  hero-reuse:
    if: inputs.mode == 'hero-reuse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hero: [knight, warden, pyro, paladin, pirate, reaper, geomancer, berserker, ranger]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/hero-bake-reuse-proof.mjs "$HERO"
        env:
          HERO: ${{ matrix.hero }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-reuse-${{ matrix.hero }}
          path: gate-data/
  pixel-debug:
    if: inputs.mode == 'pixel-debug'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: ['0','1']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-render-clock-selftest.mjs
      - run: node tools/renderer-campaign-proof.mjs 1 --only=mage --variant=baseline-control --frames=16 --scene=entry --debug-frame=9
        env:
          PIXEL_CPU_CANVAS: ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-debug-${{ matrix.backend }}
          path: gate-data/
  variant:
    if: inputs.mode == 'variant'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline-control, renderer-direct, current]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/renderer-campaign-proof.mjs 1 --only="$LEVEL" --variant="$VARIANT"
        env:
          VARIANT: ${{ matrix.variant }}
          LEVEL: ${{ inputs.variant_level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-variant-${{ matrix.variant }}
          path: gate-data/
  campaign:
    if: inputs.mode == 'campaign' || inputs.mode == 'region-props' || inputs.mode == 'fixed-ornaments'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/renderer-campaign-proof.mjs "$SHARD" --baseline="$BASELINE"
        env:
          SHARD: ${{ matrix.shard }}
          BASELINE: ${{ inputs.baseline || '5e44cddd' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-campaign-${{ matrix.shard }}
          path: gate-data/
  calls:
    if: inputs.mode == 'calls'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/draw-cost-probe.mjs "$LEVEL"
        env:
          LEVEL: ${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-cost-${{ matrix.level }}
          path: gate-data/
  mobile:
    if: inputs.mode == 'mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/load-perf-mobile-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-comparison
          path: gate-data/
  compare:
    if: inputs.mode == 'compare' || inputs.mode == 'present'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/canvas-bitmap-proof.mjs
        if: inputs.present == 'bitmap' && inputs.mode == 'present'
      - name: Same-runner original phone setup, pixels and three FPS samples per build
        env:
          LEVEL: ${{ matrix.level }}
          PRESENT: ${{ inputs.mode == 'present' && inputs.present || 'drawImage' }}
          BASELINE: ${{ inputs.baseline || '5e44cddd' }}
          CONTROL: ${{ inputs.control && 'true' || 'false' }}
        run: |
          args=()
          if [[ "$CONTROL" == 'true' ]]; then
            args+=(--control)
          fi
          node tools/load-perf-compare.mjs "$LEVEL" --present="$PRESENT" --baseline="$BASELINE" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-${{ matrix.level }}
          path: gate-data/
  sfx:
    if: inputs.mode == 'sfx'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/sfx-loader-selftest.mjs
      - run: node tools/audio-assets.mjs
      - run: node tools/voices-check.mjs
      - run: node tools/footsteps-check.mjs
      - run: node tools/sfx-demand.mjs
      - run: node tools/sfx-entry.mjs
      - run: node tools/music-priority.mjs
      - run: node tools/loading-screen.mjs
      - run: node tools/frame-cost.mjs
      - run: node tools/modulepreload.mjs
      - run: node tools/mobile-perf.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfx-demand-proof
          path: gate-data/
  profile:
    if: inputs.mode == 'profile' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Profile campaign entries and live arenas at four-times CPU throttle
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          mkdir -p gate-data
          timeout --signal=TERM --kill-after=30s 25m node tools/load-perf-probe.mjs --shard="$SHARD/8" 2>&1 | tee gate-data/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-perf-${{ matrix.shard }}
          path: gate-data/
          if-no-files-found: error
