          node-version: '24.11.1'
      - run: node tools/captain-boot-bake-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captain-boot
          path: gate-data/
  cpu-profile:
    if: inputs.mode == 'cpu-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/arena-cpu-profile.mjs "$LEVEL"
        env:
          LEVEL: ${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-cpu-${{ matrix.level }}
          path: gate-data/
  tile-cache:
    if: inputs.mode == 'tile-cache'
