    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hero: [knight, warden, pyro, paladin, pirate, reaper, geomancer, berserker, ranger]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/hero-bake-reuse-proof.mjs "$HERO"
        env:
          HERO: ${{ matrix.hero }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-reuse-${{ matrix.hero }}
          path: gate-data/
  pixel-debug:
    if: inputs.mode == 'pixel-debug'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: ['0','1']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-render-clock-selftest.mjs
      - run: node tools/renderer-campaign-proof.mjs 1 --only=mage --variant=baseline-control --frames=16 --scene=entry --debug-frame=9
        env:
          PIXEL_CPU_CANVAS: ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-debug-${{ matrix.backend }}
