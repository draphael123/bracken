name: load-perf-proof
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [captured-level-art-component, fixed-level-art-selfcontained-loader, fixed-level-art-main-loader, fixed-level-art-view-component, fixed-level-art-weak-component, frame-tile-typed-arenas, fixed-level-art-component, frame-tile-lips-arenas, frame-tile-pattern-component, art-use-coverage, fresh-canvas-clone-component, wall-phase-pattern-component, wall-pattern-runs-component, opaque-invisible-standing, foreground-invisible-arenas, foreground-invisible-component, foreground-row-component, opaque-art-fused-cold, opaque-art-fused-component, private-foreground-component, layout-work-queue, opaque-sprite-diagnostic, opaque-sprite-union, opaque-tile-standing, deferred-standing, palette-ui, palette-standing, palette-base, layout-candidate, foreground-reuse, foreground-direct, fixed-ornaments, region-props, border-present, tile-warm, captain-boot, cpu-profile, tile-cache, paladin-boot, hero-reuse, profile, sfx, compare, mobile, calls, present, campaign, variant, pixel-debug]
        default: profile
      baseline:
        type: string
        default: '5e44cddd'
      control:
        type: boolean
        default: false
      pixel_cpu:
        type: boolean
        default: false
      variant_level:
        type: choice
        options: [mage, witchlight]
        default: mage
      present:
        type: choice
        options: [copy, pattern, cpu-frame, sync-display, bitmap, opaque-frame]
        default: copy
env:
  PIXEL_CPU_CANVAS: ${{ inputs.pixel_cpu && '1' || '0' }}
permissions:
  contents: read
jobs:
  opaque-invisible-standing:
    if: inputs.mode == 'opaque-invisible-standing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: [memory,layout,campaign-1,campaign-2,campaign-3,campaign-4,campaign-5,campaign-6,campaign-7,campaign-8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: opaque-invisible-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Verify source and all original tool hashes
        run: node tools/opaque-invisible-standing-proof.mjs verify --game=opaque-invisible-game
      - name: Original source-specific proofs without overrides
        run: |
          if [[ "$SCOPE" == campaign-* ]]; then
            node tools/opaque-invisible-standing-proof.mjs campaign --shard="${SCOPE#campaign-}" --game=opaque-invisible-game
          else
            node tools/opaque-invisible-standing-proof.mjs "$SCOPE" --game=opaque-invisible-game
          fi
        env:
          SCOPE: ${{ matrix.scope }}
          OPAQUE_TILE_OUT: ${{ runner.temp }}/opaque-invisible-standing-${{ matrix.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opaque-invisible-standing-${{ matrix.scope }}
          path: ${{ runner.temp }}/opaque-invisible-standing-${{ matrix.scope }}/
          if-no-files-found: error
  foreground-invisible-arenas:
    if: inputs.mode == 'foreground-invisible-arenas'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/foreground-invisible-proof.mjs --verify-only
      - name: Original A/B/A controls and all120 frame/display/state/RNG samples
        run: node tools/foreground-invisible-proof.mjs "$LEVEL" --baseline=62d9c02c102decc69ceaef4e1ec593a23170f1ff --control
        env:
          LEVEL: ${{ matrix.level }}
          FOREGROUND_INVISIBLE_OUT: ${{ runner.temp }}/bracken-foreground-invisible
      - uses: actions/upload-artifact@v4
