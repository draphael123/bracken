      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/draw-cost-probe.mjs "$LEVEL"
        env:
          LEVEL: ${{ matrix.level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draw-cost-${{ matrix.level }}
          path: gate-data/
  mobile:
    if: inputs.mode == 'mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/load-perf-mobile-compare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-comparison
          path: gate-data/
  compare:
    if: inputs.mode == 'compare' || inputs.mode == 'present'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        level: [undercrown, lamplit, hanging, hurricane, minecart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/canvas-bitmap-proof.mjs
        if: inputs.present == 'bitmap' && inputs.mode == 'present'
      - name: Same-runner original phone setup, pixels and three FPS samples per build
        env:
          LEVEL: ${{ matrix.level }}
          PRESENT: ${{ inputs.mode == 'present' && inputs.present || 'drawImage' }}
          BASELINE: ${{ inputs.baseline || '5e44cddd' }}
          CONTROL: ${{ inputs.control && 'true' || 'false' }}
        run: |
          args=()
          if [[ "$CONTROL" == 'true' ]]; then
            args+=(--control)
          fi
          node tools/load-perf-compare.mjs "$LEVEL" --present="$PRESENT" --baseline="$BASELINE" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-${{ matrix.level }}
          path: gate-data/
  sfx:
    if: inputs.mode == 'sfx'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/sfx-loader-selftest.mjs
      - run: node tools/audio-assets.mjs
      - run: node tools/voices-check.mjs
      - run: node tools/footsteps-check.mjs
      - run: node tools/sfx-demand.mjs
      - run: node tools/sfx-entry.mjs
      - run: node tools/music-priority.mjs
      - run: node tools/loading-screen.mjs
      - run: node tools/frame-cost.mjs
      - run: node tools/modulepreload.mjs
      - run: node tools/mobile-perf.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sfx-demand-proof
          path: gate-data/
  profile:
    if: inputs.mode == 'profile' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Profile campaign entries and live arenas at four-times CPU throttle
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          mkdir -p gate-data
          timeout --signal=TERM --kill-after=30s 25m node tools/load-perf-probe.mjs --shard="$SHARD/8" 2>&1 | tee gate-data/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-perf-${{ matrix.shard }}
          path: gate-data/
          if-no-files-found: error
