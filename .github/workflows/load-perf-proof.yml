      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/paladin-boot-bake-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paladin-boot
          path: gate-data/
  hero-reuse:
    if: inputs.mode == 'hero-reuse'
