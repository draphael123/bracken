name: Rootway binary column native qualification
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/rootway-binary-column-native-nov06/manifest.json
      - tools/rootway-binary-column-native-nov06/cases.mjs
      - tools/rootway-binary-column-native-nov06/component.mjs
      - .github/workflows/rootway-binary-column-native-nov06.yml
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [zone0-top-face, zone0-ceil-mass, zone1-top-face, zone1-ceil-mass, zone2-top-face, zone2-ceil-mass, zone3-top-face, zone3-ceil-mass, zone4-top-face, zone4-ceil-mass, palette, metadata, gpu, public, contracts, before-module, after-module, streaming, descriptor-hooks, native-records, context-owners, image-data-hooks, iterator-capture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Full original native graph snapshot, original scopes and observer captures
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/rootway-binary-column-native-nov06/component.mjs
        env:
          ROOTWAY_BINARY_COLUMN_GROUP: ${{ matrix.group }}
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/rootway-binary-column-native-${{ matrix.group }}-nov06
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootway-binary-column-native-${{ matrix.group }}-nov06
          path: |
            ${{ runner.temp }}/rootway-binary-column-native-${{ matrix.group }}-nov06/
            ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
          if-no-files-found: error
