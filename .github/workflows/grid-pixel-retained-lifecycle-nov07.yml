name: Grid original retained callback AFTER-return lifecycle proof
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/grid-pixel-publication-native-nov07/cases-retained-lifecycle.mjs
      - tools/grid-pixel-publication-native-nov07/component-retained-lifecycle.mjs
      - .github/workflows/grid-pixel-retained-lifecycle-nov07.yml
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [arguments-24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Full original native graph snapshot, original scopes and observer captures
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/grid-pixel-publication-native-nov07/component-retained-lifecycle.mjs
        env:
          GRID_PIXEL_PUBLICATION_GROUP: ${{ matrix.group }}
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/grid-pixel-retained-lifecycle-${{ matrix.group }}-nov07
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-pixel-retained-lifecycle-${{ matrix.group }}-nov07
          path: |
            ${{ runner.temp }}/grid-pixel-retained-lifecycle-${{ matrix.group }}-nov07/
            ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
          if-no-files-found: error
