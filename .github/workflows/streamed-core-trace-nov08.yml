name: Complete disk-streamed native trace qualification
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/streamed-core-trace-nov08/**
      - .github/workflows/streamed-core-trace-nov08.yml
permissions: {contents: read}
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: New complete byte oracle and corruption rejection
        run: node tools/streamed-core-trace-nov08/protocol.mjs
        env:
          TRACE_PROTOCOL_OUT: ${{ runner.temp }}/streamed-trace-protocol-nov08
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamed-trace-protocol-nov08
          path: ${{ runner.temp }}/streamed-trace-protocol-nov08/
          if-no-files-found: error
  preflight:
    needs: protocol
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Complete native bytes and unchanged source controls
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/streamed-core-trace-nov08/component.mjs
        env:
          PRIVATE_NATIVE_RECORDER_GROUP: preflight
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/streamed-core-trace-preflight-nov08
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/streamed-core-trace-preflight-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamed-core-trace-preflight-nov08
          path: |
            ${{ runner.temp }}/streamed-core-trace-preflight-nov08/
            ${{ runner.temp }}/streamed-core-trace-preflight-profile.jsonl
          if-no-files-found: error
  native:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [unknown-0, unknown-1, unknown-2, unknown-3, unknown-4, unknown-5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Complete native bytes and unchanged source controls
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/streamed-core-trace-nov08/component.mjs
        env:
          PRIVATE_NATIVE_RECORDER_GROUP: ${{ matrix.group }}
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/streamed-core-trace-${{ matrix.group }}-nov08
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/streamed-core-trace-${{ matrix.group }}-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamed-core-trace-${{ matrix.group }}-nov08
          path: |
            ${{ runner.temp }}/streamed-core-trace-${{ matrix.group }}-nov08/
            ${{ runner.temp }}/streamed-core-trace-${{ matrix.group }}-profile.jsonl
          if-no-files-found: error
