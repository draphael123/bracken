name: Private near-tree circle native qualification
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/near-circle-path-native-nov05/manifest.json
      - tools/near-circle-path-native-nov05/cases.mjs
      - tools/near-circle-path-native-nov05/component.mjs
      - .github/workflows/near-circle-path-native-nov05.yml
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [defaults, palette0, palette1, palette2, palette3, palette4, values, palette-observers, after-hooks-a, after-hooks-b, temporary, initial, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Full original native graph snapshot, original scopes and observer captures
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/near-circle-path-native-nov05/component.mjs
        env:
          NEAR_CIRCLE_GROUP: ${{ matrix.group }}
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/near-circle-path-native-${{ matrix.group }}-nov05
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: near-circle-path-native-${{ matrix.group }}-nov05
          path: |
            ${{ runner.temp }}/near-circle-path-native-${{ matrix.group }}-nov05/
            ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
          if-no-files-found: error
