name: Bound closedhelm missing non-browser path control only
on:
  workflow_dispatch:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/closedhelm-bound-node-path-recovery-nov06/*.json
      - tools/closedhelm-bound-node-path-recovery-nov06/*.mjs
permissions: {contents: read}
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: sprite-publication-safety-game
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: sprite-publication-original-tools
      - uses: actions/setup-node@v4
        with: {node-version: '24.11.1'}
      - name: Previously unexecuted original fixture, unchanged source and strict1536MB
        run: node tools/closedhelm-bound-node-path-recovery-nov06/check.mjs
        env:
          PRIVATE_HERO_GAME: sprite-publication-safety-game
          PRIVATE_HERO_ORIGINAL_TOOLS: sprite-publication-original-tools
          PRIVATE_HERO_SAFETY_SCOPE: publicApi
          PRIVATE_HERO_SAFETY_OUT: ${{ runner.temp }}/closedhelm-bound-node-path-recovery-nov06
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closedhelm-bound-node-path-recovery-nov06
          path: ${{ runner.temp }}/closedhelm-bound-node-path-recovery-nov06/
          if-no-files-found: error
