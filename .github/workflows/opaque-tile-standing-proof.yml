name: opaque-tile-standing-proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opaque-tile-standing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scope: [memory,layout,campaign-1,campaign-2,campaign-3,campaign-4,campaign-5,campaign-6,campaign-7,campaign-8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: opaque-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Verify source and all original tool hashes
        run: node tools/opaque-tile-standing-proof.mjs verify --game=opaque-game
      - name: Original source-specific proofs without overrides
        run: |
          if [[ "$SCOPE" == campaign-* ]]; then
            node tools/opaque-tile-standing-proof.mjs campaign --shard="${SCOPE#campaign-}" --game=opaque-game
          else
            node tools/opaque-tile-standing-proof.mjs "$SCOPE" --game=opaque-game
          fi
        env:
          SCOPE: ${{ matrix.scope }}
          OPAQUE_TILE_OUT: ${{ runner.temp }}/opaque-tile-standing-${{ matrix.scope }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opaque-tile-standing-${{ matrix.scope }}
          path: ${{ runner.temp }}/opaque-tile-standing-${{ matrix.scope }}/
          if-no-files-found: error
