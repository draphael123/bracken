name: layout-schedule-proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Original full strict layout, unchanged ten-minute check deadline
        run: node tools/textfit-memory-proof.mjs
        env:
          TEXTFIT_PAGES: ${{ matrix.workers }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-workers-${{ matrix.workers }}
          path: gate-data/textfit-memory/
