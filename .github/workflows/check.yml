# THE CHECK, ON EVERY PUSH. The same audits `npm run check` runs locally, then a short boss pass and a kill-zone sweep in
# the Chrome GitHub's runners already carry (tools/headless.mjs drives it over DevTools; nothing is installed).
name: check
on:
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A RED RUN MUST SAY WHAT WENT RED WITHOUT A SIGN-IN. Run #108 failed on 2026-09-24 and the only thing anybody
      # could read from outside was "Process completed with exit code 1": the log itself needs a signed-in session
      # with admin rights, and the annotations carried nothing. Two sessions spent an afternoon on hypotheses -
      # case sensitivity, path separators, the 40-minute cap - and every one of them was wrong, because none of us
      # could see the one line that says which check failed. `::error::` annotations ARE readable unauthenticated,
      # so the FAIL lines go there and the next red run explains itself to anyone with the URL.
      - name: audits
        run: |
          set -o pipefail
          npm run check 2>&1 | tee check.log || {
            echo "::error title=npm run check failed::$(grep -E '^[0-9]+ check\(s\) failed' check.log | head -1)"
            grep -E '^FAIL ' check.log | while IFS= read -r l; do echo "::error title=failing check::$l"; done
            # THE WHOLE DETAIL BLOCK, AS ONE ANNOTATION. The first version emitted 40 lines as 40 separate
            # annotations and that was too narrow twice over: profile-cleanup's detail was cut off entirely while
            # dangling-paths' fitted, so a red run named two checks and explained only one. A GitHub workflow
            # command takes newlines as %0A, so the entire block goes in a single message and there is no per-line
            # annotation cap to run into. check.mjs prints the last 30 lines per failing check, so this is bounded.
            echo "::error title=check detail::$(sed -n '/^---- /,$p' check.log | head -400 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }
      - name: headless boss pass and kill-zone sweep
        run: node tools/headless.mjs
