name: standingreds-proof
on:
  push:
    branches: ['codex/standingreds2']
    paths-ignore: ['.github/workflows/standingreds-proof.yml', 'tools/refresh-standing-stamps.mjs', 'tools/trace-weight-probe.mjs']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prove, refresh, trace-probe]
        default: prove
permissions:
  contents: read
jobs:
  standalone:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'prove'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [berserker, dune-worm, bells, rule-openings, slopes-trace, visible-supports-strict, reed-island, small-adds, textfit-talk, textfit-levelcard, mash-gate, curve-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Three consecutive standalone passes, stop at the first red
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -o pipefail
          mkdir -p gate-data
          timeout --signal=TERM --kill-after=30s 40m node tools/standingreds-proof.mjs "$CHECK" gate-data 2>&1 | tee gate-data/combined.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standingreds-${{ matrix.check }}
          path: |
            gate-data/
            audits/readability/textfit.json
            audits/readability/textfit/
          if-no-files-found: error
  trace-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'trace-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/trace-weight-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-weight-probe
          path: gate-data/
  refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Measure only rows made stale by documented deliberate changes
        run: |
          set -o pipefail
          mkdir -p gate-data
          git rev-parse HEAD > gate-data/source.txt
          timeout --signal=TERM --kill-after=30s 40m node tools/refresh-standing-stamps.mjs 2>&1 | tee gate-data/refresh.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-standing-stamps
          path: |
            gate-data/
            docs/mash-bot.json
            docs/level1-curve.json
          if-no-files-found: error
