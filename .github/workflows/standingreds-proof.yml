name: standingreds-proof
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [mage-prefix, layout-schedule, towpath-visibility, theatre-trace, layout-gc, mark-trace, tile-cache, hero-reuse-checks, canal-proof, cause-fixes, remaining, prove, refresh, trace-probe, trace-context, trace-calibrate, canvas-memory, moor, serial, harness, lab-trace, heap512, yield-memory, unforced-heap, load-audit, memory-policy, pool-recycle, textfit-memory, hidden-memory, mark-memory, server-lease, server-only]
        default: prove
permissions:
  contents: read
jobs:
  mage-prefix:
    if: inputs.mode == 'mage-prefix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/mage-pose-prefix-probe.mjs --verify-only
      - run: node tools/mage-pose-prefix-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mage-prefix-diagnosis
          path: gate-data/mage-prefix/
  layout-schedule:
    if: inputs.mode == 'layout-schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Original full strict layout, unchanged ten-minute check deadline
        run: node tools/textfit-memory-proof.mjs
        env:
          TEXTFIT_PAGES: ${{ matrix.workers }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-workers-${{ matrix.workers }}
          path: gate-data/textfit-memory/
  towpath-visibility:
    if: inputs.mode == 'towpath-visibility'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/canal-overlap-proof.mjs
      - run: |
          for n in 1 2 3; do
            node tools/towpath-overlap-proof.mjs
            cp gate-data/towpath-overlap-proof.json "gate-data/towpath-overlap-$n.json"
          done
      - run: node tools/standingreds-proof.mjs no-hidden-hits gate-data/towpath-visibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: towpath-visibility
          path: gate-data/
  theatre-trace:
    if: inputs.mode == 'theatre-trace'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/theatre-audience-trace.mjs --verify-only
      - run: |
          mkdir -p gate-data
          failed=0
          for n in 1 2 3; do
            if node tools/theatre-audience-trace.mjs > "gate-data/theatre-$n.log" 2>&1; then
              echo "Theatre occurrence $n passed"
            else
              failed=1
            fi
            if test -f gate-data/theatre-audience-trace.json; then
              mv gate-data/theatre-audience-trace.json "gate-data/theatre-trace-$n.json"
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theatre-audience-trace
          path: gate-data/
  layout-gc:
    if: inputs.mode == 'layout-gc'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/layout-gc-cost.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-gc-cost
          path: gate-data/
  mark-trace:
    if: inputs.mode == 'mark-trace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [control, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Prepare the exact pre-cache control
        if: matrix.variant == 'control'
        run: |
          git worktree add --detach /tmp/mark-control 69a81a272ea9ba74fb4b7006ad80d13c118ac5c0
          cp tools/mark-integrity-trace.mjs /tmp/mark-control/tools/
      - name: Original complete mark oracle with state logging
        working-directory: ${{ matrix.variant == 'control' && '/tmp/mark-control' || github.workspace }}
        run: |
          set -o pipefail
          mkdir -p gate-data
          node tools/mark-integrity-trace.mjs --verify-only
          node tools/mark-integrity-trace.mjs 2>&1 | tee gate-data/mark-trace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mark-trace-${{ matrix.variant }}
          path: ${{ matrix.variant == 'control' && '/tmp/mark-control/gate-data/' || 'gate-data/' }}
  hero-reuse-checks:
    if: inputs.mode == 'hero-reuse-checks' || inputs.mode == 'tile-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [textfit-full, mark-integrity, no-hidden-hits]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/textfit-memory-proof.mjs
        if: matrix.check == 'textfit-full'
      - run: node tools/lab-memory-check.mjs "$CHECK"
        if: matrix.check != 'textfit-full'
        env:
          CHECK: ${{ matrix.check }}
          NO_HIDDEN_RESULT: gate-data/no-hidden-hits.measurement.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-reuse-checks-${{ matrix.check }}
          path: gate-data/
  tile-cache-pixels:
    if: inputs.mode == 'tile-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/level-tile-cache-selftest.mjs
      - run: node tools/tile-cache-lifetime-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tile-cache-pixels
          path: gate-data/
  canal-proof:
    if: inputs.mode == 'canal-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/canal-overlap-proof.mjs
      - run: node tools/standingreds-proof.mjs no-hidden-hits gate-data/canal-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-proof
          path: gate-data/
  cause-fixes:
    if: inputs.mode == 'cause-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [berserker, crouch-feet]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/crouch-feet-collection-proof.mjs
        if: matrix.check == 'crouch-feet'
      - run: node tools/standingreds-proof.mjs "$CHECK" gate-data/cause-fixes
        env:
          CHECK: ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cause-fixes-${{ matrix.check }}
          path: gate-data/
  remaining:
    if: inputs.mode == 'remaining'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [normal-health, tower-chase, harvest-fair, ai-companion]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/standingreds-proof.mjs "$CHECK" gate-data/remaining
        env:
          CHECK: ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-${{ matrix.check }}
          path: gate-data/
  server-lease:
    if: inputs.mode == 'server-lease' || inputs.mode == 'server-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/server-lease-selftest.mjs
      - run: node tools/server-lease-proof.mjs
      - run: node tools/textfit-memory-proof.mjs
        if: inputs.mode == 'server-lease'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-lease-layout-proof
          path: gate-data/
  mark-memory:
    if: inputs.mode == 'mark-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-memory-check.mjs mark-integrity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mark-memory-proof
          path: gate-data/
  hidden-memory:
    if: inputs.mode == 'hidden-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-memory-check.mjs no-hidden-hits
        env:
          NO_HIDDEN_RESULT: gate-data/no-hidden-hits.measurement.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hidden-memory-proof
          path: gate-data/
  textfit-memory:
    if: inputs.mode == 'textfit-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/textfit-memory-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: textfit-memory-proof
          path: gate-data/
  pool-recycle:
    if: inputs.mode == 'pool-recycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/memory-policy-selftest.mjs
      - run: node tools/browser-admission-selftest.mjs
      - run: node tools/pool-recycle-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pool-recycle-proof
          path: gate-data/
  memory-policy:
    if: inputs.mode == 'memory-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRACKEN_RENDERER_MB: '2560'
      LOADLEAK_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/memory-policy-selftest.mjs
      - run: node tools/browser-admission-selftest.mjs
      - run: node tools/suite-progress-selftest.mjs
      - run: node tools/profile-cleanup.mjs
      - run: node tools/load-audit-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-policy-proof
          path: gate-data/
  load-audit:
    if: inputs.mode == 'load-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/load-audit-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-audit-proof
          path: gate-data/
  unforced-heap:
    if: inputs.mode == 'unforced-heap'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        heap: [256,512,2048]
    env:
      BRACKEN_HEAP_MB: ${{ matrix.heap }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-memory-check.mjs load-leak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unforced-heap-${{ matrix.heap }}
          path: gate-data/
  yield-memory:
    if: inputs.mode == 'yield-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [boss-openings, levelling-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-memory-check.mjs "$CHECK"
        env:
          CHECK: ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yield-memory-${{ matrix.check }}
          path: gate-data/
  heap512:
    if: inputs.mode == 'heap512'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [raft-recall, boss-openings, levelling-runtime]
    env:
      BRACKEN_HEAP_MB: '512'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-collect-selftest.mjs
      - run: node tools/lab-memory-check.mjs "$CHECK"
        env:
          CHECK: ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heap512-${{ matrix.check }}
          path: gate-data/
  lab-trace:
    if: inputs.mode == 'lab-trace'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-collect-selftest.mjs
      - run: node tools/lab-navigation-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-game-trace
          path: gate-data/
  harness:
    if: inputs.mode == 'harness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [raft-recall, boss-openings, levelling-runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-collect-selftest.mjs
      - run: node tools/lab-navigation-proof.mjs
      - run: node tools/lab-memory-check.mjs "$CHECK"
        env:
          CHECK: ${{ matrix.check }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-${{ matrix.check }}
          path: gate-data/
  serial:
    if: inputs.mode == 'serial'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Complete original serial gate with durable per-check results
        run: |
          set -o pipefail
          mkdir -p gate-data
          git rev-parse HEAD > gate-data/source.txt
          gate_deadline=$(( $(date +%s) + 19800 ))
          set +e
          timeout --signal=TERM --kill-after=30s 330m node tools/check.mjs --progress=gate-data/serial.json 2>&1 | tee gate-data/serial.log
          gate_status=${PIPESTATUS[0]}
          if [[ "$gate_status" == 2 ]]; then
            gate_remaining=$(( gate_deadline - $(date +%s) ))
            if (( gate_remaining > 0 )); then
              echo '[resume] Once, only unanswered checks; saved FAIL verdicts remain FAIL.' | tee -a gate-data/serial.log
              timeout --signal=TERM --kill-after=30s "${gate_remaining}s" node tools/check.mjs --resume=gate-data/serial.json 2>&1 | tee -a gate-data/serial.log
              gate_status=${PIPESTATUS[0]}
            fi
          fi
          exit "$gate_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-serial-standingreds
          path: gate-data/
  moor:
    if: inputs.mode == 'moor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/gust-hands-selftest.mjs
      - run: node tools/gust-hands-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moor-gust-proof
          path: gate-data/moor/
  trace-calibrate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'trace-calibrate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/calibrate-slopes-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slopes-trace-calibration
          path: gate-data/
  canvas-memory:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'canvas-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/lab-canvas-proof.mjs
      - name: Original heavy checks with the same memory cap and assertions
        env:
          BRACKEN_CPU_CANVAS: '1'
        run: node tools/check.mjs boss-openings,levelling-runtime,boss-fight-end,dances,slide,corpses --progress=gate-data/heavy.json
      - name: Full-campaign levelcards, four loads per early-CPU page, three repetitions
        env:
          BRACKEN_CPU_CANVAS: '1'
          TEXTFIT_BATCH: '4'
        run: node tools/standingreds-proof.mjs textfit-levelcard gate-data/levelcards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-memory-proof
          path: gate-data/
  standalone:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'prove'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [berserker, dune-worm, bells, rule-openings, slopes-trace, visible-supports-strict, reed-island, small-adds, textfit-talk, textfit-levelcard, mash-gate, curve-gate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Three consecutive standalone passes, stop at the first red
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -o pipefail
          mkdir -p gate-data
          timeout --signal=TERM --kill-after=30s 40m node tools/standingreds-proof.mjs "$CHECK" gate-data 2>&1 | tee gate-data/combined.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standingreds-${{ matrix.check }}
          path: |
            gate-data/
            audits/readability/textfit.json
            audits/readability/textfit/
          if-no-files-found: error
  trace-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'trace-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/trace-weight-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-weight-probe
          path: gate-data/
  trace-context:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'trace-context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/trace-context-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-context
          path: gate-data/
  refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Measure only rows made stale by documented deliberate changes
        run: |
          set -o pipefail
          mkdir -p gate-data
          git rev-parse HEAD > gate-data/source.txt
          timeout --signal=TERM --kill-after=30s 40m node tools/refresh-standing-stamps.mjs 2>&1 | tee gate-data/refresh.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-standing-stamps
          path: |
            gate-data/
            docs/mash-bot.json
            docs/level1-curve.json
          if-no-files-found: error
