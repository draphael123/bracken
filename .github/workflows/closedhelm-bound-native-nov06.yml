name: Bound closedhelm complete native factory qualification
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/closedhelm-bound-native-nov06/manifest.json
      - tools/closedhelm-bound-native-nov06/cases.mjs
      - tools/closedhelm-bound-native-nov06/component.mjs
      - .github/workflows/closedhelm-bound-native-nov06.yml
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [canonical, gpu, active, delayed, before-source-createElement, after-capture-createElement, before-source-getContext, after-capture-getContext, before-source-fillStyle, after-capture-fillStyle, before-source-fillRect, after-capture-fillRect, before-source-arrayIterator, after-capture-arrayIterator, before-source-iteratorNext, after-capture-iteratorNext, before-source-arrayMap, after-capture-arrayMap, before-source-arrayPush, after-capture-arrayPush, before-source-sin, after-capture-sin, before-source-imageDataData, after-capture-imageDataData, before-source-objectLean, after-capture-objectLean, before-source-descriptorValue, after-capture-descriptorValue, before-source-regexpExec, after-capture-regexpExec]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Full original native graph snapshot, original scopes and observer captures
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/closedhelm-bound-native-nov06/component.mjs
        env:
          CLOSEDHELM_BOUND_GROUP: ${{ matrix.group }}
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/closedhelm-bound-native-${{ matrix.group }}-nov06
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closedhelm-bound-native-${{ matrix.group }}-nov06
          path: |
            ${{ runner.temp }}/closedhelm-bound-native-${{ matrix.group }}-nov06/
            ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
          if-no-files-found: error
