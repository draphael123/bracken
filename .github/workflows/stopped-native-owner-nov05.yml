name: Stopped native allocation ownership capture
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/stopped-native-owner-nov05/manifest.json
      - tools/stopped-native-owner-page-nov05.mjs
      - tools/stopped-native-owner-nov05.mjs
      - .github/workflows/stopped-native-owner-nov05.yml
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: One stopped-session native capture; original Game and1536MB intact
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/stopped-native-owner-nov05.mjs
        env:
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/stopped-native-owner-nov05
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/skyroad-guide-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stopped-native-owner-nov05
          path: |
            ${{ runner.temp }}/stopped-native-owner-nov05/
            ${{ runner.temp }}/skyroad-guide-strict-profile.jsonl
          if-no-files-found: error
