name: Curve startup strict profile binding proof
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/curve-profile-binding-nov04/**
      - tools/curve-profile-binding-nov04.mjs
      - .github/workflows/curve-profile-binding-nov04.yml
permissions: {contents: read}
jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Module identity and original adapter byte undo only, zero browsers
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/curve-profile-binding-nov04.mjs
        env:
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/curve-profile-binding/strict-profile.jsonl
          CURVE_BINDING_OUT: ${{ runner.temp }}/curve-profile-binding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curve-profile-binding-nov04
          path: ${{ runner.temp }}/curve-profile-binding/
          if-no-files-found: error
