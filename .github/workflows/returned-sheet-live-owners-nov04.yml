name: Returned sheet live canvas owners
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/returned-sheet-live-owners-nov04.mjs
      - tools/returned-sheet-owner-observer-nov04.mjs
      - .github/workflows/returned-sheet-live-owners-nov04.yml
permissions: {contents: read}
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: owner-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Weak ownership census with the original renderer guard
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/returned-sheet-live-owners-nov04.mjs
        env:
          OWNER_GAME: owner-game
          OWNER_OUT: ${{ runner.temp }}/returned-sheet-live-owners-nov04
          BRACKEN_GUARD_GAME: owner-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/returned-sheet-owners-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: returned-sheet-live-owners-nov04
          path: |
            ${{ runner.temp }}/returned-sheet-live-owners-nov04/
            ${{ runner.temp }}/returned-sheet-owners-strict-profile.jsonl
          if-no-files-found: error
