name: capture-proof
on:
  push:
    branches: [codex/replay-capture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - run: node tools/replay-modeoff.mjs
      - run: node tools/replay-proof.mjs
      - run: node tools/capture.mjs gate-data/wood.replay.json --level=wood --out=gate-data/frames --scale=3 --nohud --nonamecards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-proof
          path: gate-data/
# Each proof uses disposable browser contexts and records only its own processes.
