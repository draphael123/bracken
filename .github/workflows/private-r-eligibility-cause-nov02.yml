name: Private sprite one read-only actual-source eligibility cause November2
on:
  push:
    branches: [codex/load-perf]
    paths:
      - 'tools/private-r-eligibility-cause-nov02/**'
      - 'tools/private-r-eligibility-cause-nov02.mjs'
      - '.github/workflows/private-r-eligibility-cause-nov02.yml'
permissions: {contents: read}
jobs:
  read-only-cause:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: private-r-standing-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '24.11.1'}
      - name: Source identity and syntax before any browser
        run: |
          test -z "$(git diff 62d9c02c HEAD -- src index.html)"
          node --check tools/private-r-eligibility-cause-nov02.mjs
          node --check tools/private-r-eligibility-cause-nov02/observations.mjs
          mkdir -p "$PUBLICATION_STANDING_OUT"
          git rev-parse HEAD HEAD:src > "$PUBLICATION_STANDING_OUT/controller-source.txt"
          sha256sum tools/private-r-eligibility-cause-nov02/* tools/private-r-eligibility-cause-nov02.mjs .github/workflows/private-r-eligibility-cause-nov02.yml > "$PUBLICATION_STANDING_OUT/controller-sha256.txt"
        env:
          PUBLICATION_STANDING_OUT: ${{ runner.temp }}/private-r-eligibility-cause-nov02
      - name: One read-only model and descriptor observation;zero original assertions or timings
        run: node tools/private-r-eligibility-cause-nov02.mjs
        env:
          PUBLICATION_STANDING_GAME: private-r-standing-game
          PUBLICATION_STANDING_REFERENCE: private-r-standing-game
          PUBLICATION_STANDING_OUT: ${{ runner.temp }}/private-r-eligibility-cause-nov02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-r-eligibility-cause-nov02
          path: ${{ runner.temp }}/private-r-eligibility-cause-nov02/
          if-no-files-found: error
