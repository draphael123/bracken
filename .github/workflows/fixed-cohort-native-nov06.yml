name: Sixteen fixed factories first native layer
on:
  push:
    branches: [codex/load-perf]
    paths:
      - tools/fixed-cohort-native-nov06/manifest.json
      - tools/fixed-cohort-native-nov06/cases.mjs
      - tools/fixed-cohort-native-nov06/component.mjs
      - .github/workflows/fixed-cohort-native-nov06.yml
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [closedhelm-cpu, closedhelm-gpu, abbot-cpu, abbot-gpu, reefmaw-cpu, reefmaw-gpu, tollmaster-cpu, tollmaster-gpu, masthead-cpu, masthead-gpu, winchmaster-cpu, winchmaster-gpu, gargoyle-cpu, gargoyle-gpu, herald-cpu, herald-gpu, lampreeve-cpu, lampreeve-gpu, captain-cpu, captain-gpu, gravewarden-cpu, gravewarden-gpu, hedgewarden-cpu, hedgewarden-gpu, quarter-cpu, quarter-gpu, heavy-cpu, heavy-gpu, lancerHorse-cpu, lancerHorse-gpu, guests-cpu, guests-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1a576c3f4511b6856df9fb4738df5aaae9987e81
          path: span-game
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Full original native graph snapshot, original scopes and observer captures
        run: node --import ./tools/private-hero-profile-guard-preload-nov01.mjs tools/fixed-cohort-native-nov06/component.mjs
        env:
          FIXED_COHORT_GROUP: ${{ matrix.group }}
          FIXED_ART_GAME: span-game
          FIXED_ART_LOADER_OUT: ${{ runner.temp }}/fixed-cohort-native-${{ matrix.group }}-nov06
          BRACKEN_GUARD_GAME: span-game
          BRACKEN_GUARD_PROFILE: tools/browser-profile.mjs
          BRACKEN_GUARD_PROFILE_SHA256: 9d38b09c585f0054e40125c63b2435e61e8cd6f5cc53e6011edf62178c8c2184
          BRACKEN_GUARD_READBACK: ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-cohort-native-${{ matrix.group }}-nov06
          path: |
            ${{ runner.temp }}/fixed-cohort-native-${{ matrix.group }}-nov06/
            ${{ runner.temp }}/skyroad-spans-strict-profile.jsonl
          if-no-files-found: error
