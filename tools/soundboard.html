<!doctype html>
<html><head><meta charset="utf-8"><title>BRACKEN soundboard</title>
<!-- audio.js fetches ./audio/manifest.json relative to the PAGE, so this page pretends to live at the root -->
<base href="/">
<style>
  body { background:#14111c; color:#e8dcc0; font:12px monospace; margin:0; padding:12px 16px; }
  h1 { font-size:14px; color:#ffd36b; margin:0 0 6px; }
  h2 { color:#ffd36b; font-size:12px; margin:16px 0 6px; }
  .bar { position:sticky; top:0; background:#14111c; padding:6px 0; z-index:2; display:flex; gap:12px; flex-wrap:wrap; align-items:center; border-bottom:1px solid #3a3448; }
  .grid { display:flex; flex-wrap:wrap; gap:4px; }
  button { background:#2a2436; color:#e8dcc0; border:1px solid #4a4458; font:11px monospace; padding:3px 6px; cursor:pointer; }
  button:hover { background:#3a3448; }
  button.synth { border-color:#8a5a5a; }
  button.clip { border-color:#5a8a5a; }
  .row { display:flex; gap:6px; align-items:center; margin:2px 0; }
  .row span { width:110px; color:#c9b27c; }
  .meter { color:#9a8e74; }
</style></head><body>
<!-- THE SOUNDBOARD. The gallery for the ears: every sound the game can make, every creature's hurt and death in
     its own voice, and every hero's body, one click each. Green-edged buttons play at least one recorded clip,
     red-edged are synth alone - so "this man dies on a beep" is something you can see before you hear it.
     Open it from the dev server: /tools/soundboard.html -->
<h1>BRACKEN — soundboard</h1>
<div class="bar">
  <button id="start">start audio</button>
  <label>hero <select id="hero"><option>knight</option><option>pyro</option><option>paladin</option><option>pirate</option><option>reaper</option><option>warden</option></select></label>
  <label>filter <input id="only" size="12"></label>
  <span id="status">click start (browsers will not play sound before a click)</span>
</div>
<div id="out"></div>
<script type="module">
import * as A from '/src/audio.js';
import { THREAT } from '/src/threat.js';
const $ = id => document.getElementById(id);
const src = await (await fetch('/src/audio.js')).text();
/* does the body of this voice reach for a recorded clip? read it off the source rather than guess */
const bodyOf = (table, name) => { const i = src.indexOf('const ' + table + ' = {'); if (i < 0) return ''; const k = src.indexOf('\n  ' + name + '(', i); if (k < 0) return ''; return src.slice(k, src.indexOf('\n', k + 1)); };
const usesClip = s => /file\(|gob\(|gobH\(|voice\(/.test(s);
/* a creature in THE CAST speaks with a recorded kit whatever its own table entry does */
const castSec = src.includes('const CAST = {') ? src.slice(src.indexOf('const CAST = {'), src.indexOf('};', src.indexOf('const CAST = {'))) : '';
const cast = t => castSec.includes(' ' + t + ': {');
let started = false;
$('start').onclick = () => { A.initAudio(); started = true; $('status').textContent = 'audio on'; };
$('hero').onchange = () => A.setHeroVoice($('hero').value);
function btn(label, fn, cls) { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
  b.onclick = () => { if (!started) { A.initAudio(); started = true; } A.emitAt(null); try { fn(); } catch (e) { b.textContent = label + ' ✗'; console.error(e); } }; return b; }
function section(title) { const h = document.createElement('h2'); h.textContent = title; $('out').appendChild(h); const g = document.createElement('div'); $('out').appendChild(g); return g; }
function render() {
  $('out').innerHTML = ''; const only = $('only').value.toLowerCase(); const keep = n => !only || n.toLowerCase().includes(only);
  // THE HERO'S BODY
  const hero = section('HERO (' + $('hero').value + ')'); hero.className = 'grid';
  for (const k of ['pJump', 'pLand', 'pStep', 'pSlash', 'pHurt', 'pDie', 'pDodge', 'pPogo', 'pEffort', 'parry', 'block', 'guardBreak', 'heavy']) if (A.SFX[k] && keep(k)) hero.appendChild(btn(k, () => A.SFX[k]('stone')));
  // EVERY CREATURE THAT FIGHTS
  const foes = Object.entries(THREAT).filter(([, v]) => v > 0).map(([k]) => k).filter(keep).sort();
  const cr = section('CREATURES — hurt / die / notice (' + foes.length + ')');
  let clipD = 0, clipH = 0;
  for (const t of foes) {
    const row = document.createElement('div'); row.className = 'row'; const s = document.createElement('span'); s.textContent = t; row.appendChild(s);
    const h = A.SFX.hurtOf(t), d = A.SFX.dieOf(t), hc = cast(t) || usesClip(bodyOf('HURT', t)), dc = cast(t) || usesClip(bodyOf('DIE', t)); if (hc) clipH++; if (dc) clipD++;
    row.appendChild(btn('hurt', () => (h || A.SFX.hit)(), h ? (hc ? 'clip' : 'synth') : ''));
    row.appendChild(btn('die', () => (d || A.SFX.kill)(), d ? (dc ? 'clip' : 'synth') : ''));
    row.appendChild(btn('notice', () => A.SFX.foeNotice(t)));
    if (A.SFX.foeRelease) row.appendChild(btn('blow', () => A.SFX.foeRelease(t)));
    cr.appendChild(row);
  }
  const m = document.createElement('div'); m.className = 'meter'; m.textContent = 'recorded clip in the hurt voice: ' + clipH + '/' + foes.length + ' · in the death voice: ' + clipD + '/' + foes.length; cr.prepend(m);
  // THE CAST REVIEW: every voiced character, the kit it speaks with, its pitch and its helmet. Change anything
  // and it plays that way at once; the table at the bottom is what to send back so it can be made permanent.
  if (A.castTable) {
    const CAST = A.castTable(), HK = A.heroKitTable(), kits = A.kitNames();
    const rev = section('CAST REVIEW — pick a kit, pitch (rate) and muffle (lowpass Hz, 0 = none); edits apply live and are remembered in this browser');
    const saved = (() => { try { return JSON.parse(localStorage.getItem('bracken.castReview') || '{}'); } catch { return {}; } })();
    const store = () => { try { localStorage.setItem('bracken.castReview', JSON.stringify(saved)); } catch {} };
    const out = document.createElement('textarea'); out.rows = 8; out.style.cssText = 'width:100%;background:#1b1626;color:#e8dcc0;font:11px monospace;margin-top:8px';
    const dump = () => { out.value = 'CAST edits:\n' + Object.entries(saved).filter(([k]) => !k.startsWith('hero:')).map(([t, c]) => '  ' + t + ': ' + JSON.stringify(c)).join('\n') +
      '\nHERO edits:\n' + Object.entries(saved).filter(([k]) => k.startsWith('hero:')).map(([t, c]) => '  ' + t.slice(5) + ': ' + JSON.stringify(c)).join('\n'); };
    const editor = (label, obj, key, play) => {
      if (saved[key]) Object.assign(obj, saved[key]);
      const row = document.createElement('div'); row.className = 'row'; const s = document.createElement('span'); s.textContent = label; row.appendChild(s);
      const sel = document.createElement('select'); for (const k of kits.concat(kits.includes(obj.kit) ? [] : [obj.kit])) { const o = document.createElement('option'); o.textContent = k; if (k === obj.kit) o.selected = true; sel.appendChild(o); }
      const rate = document.createElement('input'); rate.type = 'number'; rate.step = '0.02'; rate.min = '0.5'; rate.max = '1.6'; rate.value = obj.rate; rate.style.width = '56px';
      const lp = document.createElement('input'); lp.type = 'number'; lp.step = '100'; lp.min = '0'; lp.value = obj.lp || 0; lp.style.width = '64px';
      const apply = () => { obj.kit = sel.value; obj.rate = Number(rate.value) || 1; obj.lp = Number(lp.value) || 0; saved[key] = { kit: obj.kit, rate: obj.rate, lp: obj.lp }; store(); dump(); };
      for (const el of [sel, rate, lp]) el.addEventListener('change', apply);
      row.append(sel, rate, lp); for (const [n, fn] of play) row.appendChild(btn(n, fn)); rev.appendChild(row);
    };
    for (const [h, k] of Object.entries(HK)) editor('HERO ' + h, k, 'hero:' + h, [['hurt', () => { A.setHeroVoice(h); A.SFX.pHurt(); }], ['die', () => { A.setHeroVoice(h); A.SFX.pDie(); }], ['effort', () => { A.setHeroVoice(h); A.SFX.pEffort(); }]]);
    for (const [t, c] of Object.entries(CAST).filter(([t]) => keep(t))) editor(t, c, t, [['hurt', () => A.SFX.hurtOf(t)()], ['die', () => A.SFX.dieOf(t)()], ['notice', () => A.SFX.foeNotice(t)]]);
    const clear = btn('reset all edits', () => { for (const k in saved) delete saved[k]; store(); location.reload(); });
    rev.append(out, clear); dump();
  }
  // EVERYTHING ELSE
  const all = section('ALL SFX'); all.className = 'grid';
  for (const k of A.SFX_NAMES().filter(keep).sort()) if (!['dieOf', 'hurtOf', 'jet'].includes(k)) all.appendChild(btn(k, () => A.SFX[k]()));
  window.SOUNDBOARD = { foes: foes.length, clipH, clipD };
}
render();
$('only').addEventListener('input', render);
</script></body></html>
